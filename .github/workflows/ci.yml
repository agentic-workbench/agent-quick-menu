name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `claude` is not available in CI, so `claude plugin validate` and `claude plugin test`
      # (part of `make check`) run locally only. CI checks the JSON files and the menu schema.
      - name: Check JSON files and quick-menu.json against the schema
        run: node scripts/check-json.mjs
