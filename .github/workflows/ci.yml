name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # `claude` is not available in CI, so `claude plugin validate` and `claude plugin test`
      # (part of `make check`) run locally only. CI checks the JSON files and the menu schema.
      - name: Check JSON files and quick-menu.json against the schema
        run: node scripts/check-json.mjs
