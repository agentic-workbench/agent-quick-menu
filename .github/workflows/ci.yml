name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `claude` is not available in CI, so `claude plugin validate` and `claude plugin test`
      # (part of `make check`) run locally only. CI checks the JSON files and the menu schema.
      - name: Check JSON files and quick-menu.json against the schema
        run: node scripts/check-json.mjs
