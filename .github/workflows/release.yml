name: Release

# The release logic lives in agentic-workbench/workflows (plugin-release.yml); this is only the caller.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}

jobs:
  release:
    uses: agentic-workbench/workflows/.github/workflows/plugin-release.yml@e42f60c6d3702955f01f442b47de5f23321d7c5b # main
    secrets: inherit
